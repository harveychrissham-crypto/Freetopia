name: Clean Freetopia brand asset

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean-brand-asset:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Clean outer white spill
        run: python scripts/clean_brand_asset.py

      - name: Commit cleaned asset
        run: |
          if git diff --quiet -- public/brand/freetopia-mark.png; then
            echo "Brand asset already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/freetopia-mark.png
          git commit -m "fix: remove white spill from Freetopia icon [skip ci]"
          git push
