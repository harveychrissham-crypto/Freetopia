name: Freetopia Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Android artifact type
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Supabase build configuration
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL GitHub Actions secret" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY GitHub Actions secret" && exit 1)
          echo "Supabase URL configured for build"

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="27.1.12297006"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          rm -rf \
            "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" \
            "${ANDROID_SDK_ROOT}/.temp"/*

          yes | "${SDKMANAGER}" --licenses >/dev/null || true

          installed=false
          for attempt in 1 2 3; do
            echo "Installing NDK ${NDK_VERSION}, attempt ${attempt}"
            if "${SDKMANAGER}" --install "ndk;${NDK_VERSION}" && \
              test -f "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/source.properties"; then
              installed=true
              break
            fi

            echo "NDK installation attempt ${attempt} failed; clearing partial download"
            rm -rf \
              "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" \
              "${ANDROID_SDK_ROOT}/.temp"/*
            sleep 10
          done

          if [ "$installed" != "true" ]; then
            echo "NDK ${NDK_VERSION} could not be installed"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate JavaScript bundle
        run: npx expo export --platform android --clear

      - name: Build Android APK
        working-directory: android
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK" || (echo "No APK was produced" && exit 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: freetopia-android-$BUILD_TYPE-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="freetopia-v${{ github.run_number }}-$BUILD_TYPE"
          TITLE="Freetopia Android $BUILD_TYPE #${{ github.run_number }}"

          for attempt in 1 2 3; do
            echo "Publishing APK to GitHub Releases, attempt ${attempt}/3"

            # If a previous attempt created the release before failing, reuse it.
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $TAG already exists; uploading APK asset..."
              if gh release upload "$TAG" "${{ steps.apk.outputs.path }}" \
                --repo "${{ github.repository }}" \
                --clobber; then
                echo "Successfully published APK to existing release."
                exit 0
              fi
            else
              echo "Release $TAG does not exist; creating it..."
              if gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
                --repo "${{ github.repository }}" \
                --title "$TITLE" \
                --notes "Freetopia Android $BUILD_TYPE build from commit ${{ github.sha }}." \
                --target "${{ github.sha }}"; then
                echo "Successfully created release and published APK."
                exit 0
              fi
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Release publishing attempt ${attempt} failed; retrying in 30 seconds..."
              sleep 30
            fi
          done

          echo "Failed to publish APK to GitHub Releases after 3 attempts."
          exit 1
