name: Freetopia Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Android artifact type
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Setup Gradle Cache
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: false

      - name: Validate JavaScript bundle
        run: npx expo export --platform android --clear

      - name: Build Android APK
        working-directory: android
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK" || (echo "No APK was produced" && exit 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: freetopia-android-$BUILD_TYPE-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="freetopia-v${{ github.run_number }}-$BUILD_TYPE"
          TITLE="Freetopia Android $BUILD_TYPE #${{ github.run_number }}"

          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "Freetopia Android $BUILD_TYPE build from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
